# Internal container Nginx — serves the SPA only.
# The public domain, TLS, and access control are handled by the user's
# external Nginx reverse proxy (see domain-proxy.conf.example).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: deep links such as /demos/rag resolve to index.html
    # so direct navigation and refresh work after deploy.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets are immutable; cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Optional /api reverse proxy — unused in v0.1.0 (no backend yet).
    # Uncomment and point at an upstream when a live backend is deployed
    # inside this compose network, otherwise proxy /api from the external
    # Nginx (see domain-proxy.conf.example).
    # location /api/ {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
